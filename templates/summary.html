{% extends "base.html" %}
{% block content %}

<div class="table-shell">
  <table>
    <thead>
    <tr>
      <th>{{ period_col | capitalize }}</th>
      <th class="num">Spend</th>
      <th class="num">Income</th>
    </tr>
    </thead>
    <tbody>
    {% for r in rows %}
    <tr>
      <td>{{ r[period_col] }}</td>
      <td class="{{ 'neg' if r.spend and r.spend < 0 else '' }} num">{{ '%.2f' % r.spend if r.spend else '' }}</td>
      <td class="{{ 'pos' if r.income and r.income > 0 else '' }} num">{{ '%.2f' % r.income if r.income else '' }}</td>
    </tr>
    {% endfor %}
    {% if not rows %}<tr><td colspan="3" style="color:#999;font-style:italic;padding:8px;">No data</td></tr>{% endif %}
    </tbody>
  </table>
</div>

{% endblock %}
